# render.yaml — Nemvai Production Blueprint (Render)
# Connects AlilouTopG/nemvai repo — just link it at dashboard.render.com
services:
  - type: web
    name: nemvai
    env: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --config gunicorn.conf.py
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nemvai-db
          property: connectionString
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: 2
      - key: JWT_REFRESH_TOKEN_EXPIRES_DAYS
        value: 7
      - key: APP_NAME
        value: Nemvai
      - key: FRONTEND_URL
        fromService:
          name: nemvai
          type: web
          property: host

databases:
  - name: nemvai-db
    plan: free
    databaseName: nemvai
    user: nemvai
