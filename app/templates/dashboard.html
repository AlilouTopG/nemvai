<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArenaX — لوحة التحكم</title>
<link rel="stylesheet" href="/static/css/main.css">
<meta name="color-scheme" content="dark">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">AX</div>
      <div><span>ArenaX</span><small id="userLine">... جاري التحقق</small></div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="refreshAll()">تحديث</button>
      <button class="btn btn-danger" onclick="logout()">خروج</button>
    </div>
  </div>
</nav>

<div class="container">
  <!-- Top stats -->
  <div class="grid grid-3" style="margin:16px 0">
    <div class="card">
      <div class="muted" style="font-size:.8rem">المهام النشطة</div>
      <div style="font-size:1.8rem;font-weight:900" id="statTasks">—</div>
      <div class="progress" style="margin-top:10px"><i id="progTasks"></i></div>
    </div>
    <div class="card">
      <div class="muted" style="font-size:.8rem">العادات + ستريك اليوم</div>
      <div style="font-size:1.8rem;font-weight:900" id="statHabits">—</div>
      <div class="hint" id="statStreak"></div>
    </div>
    <div class="card">
      <div class="muted" style="font-size:.8rem">جلسات تركيز اليوم</div>
      <div style="font-size:1.8rem;font-weight:900" id="statPom">0</div>
      <div class="hint">Pomodoro 25/5 — تتبع محلي آمن</div>
    </div>
  </div>

  <div class="grid grid-2">
    <!-- Smart Task Manager -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;justify-content:space-between">
        <h3>📋 لوحة المهام الذكية</h3>
        <select id="filterStatus" onchange="loadTasks()" class="select-sm">
          <option value="">الكل</option><option value="todo">قيد الانتظار</option><option value="in_progress">قيد التنفيذ</option><option value="done">مكتملة</option>
        </select>
      </div>

      <form onsubmit="createTask(event)" style="display:grid;gap:10px;margin:14px 0;padding:14px;border:1px dashed var(--border);border-radius:14px;background:#0f0f17">
        <input class="input" id="t_title" placeholder="عنوان المهمة — مثال: إنهاء تصميم ArenaX" required>
        <textarea id="t_desc" rows="2" placeholder="وصف (اختياري)"></textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="t_cat" style="flex:1"><option value="work">عمل</option><option value="personal" selected>شخصي</option><option value="study">دراسة</option><option value="health">صحة</option><option value="other">أخرى</option></select>
          <select id="t_prio" style="flex:1"><option value="low">منخفض</option><option value="medium" selected>متوسط</option><option value="high">مرتفع</option><option value="urgent">عاجل</option></select>
          <input id="t_due" type="date" style="flex:1" class="input">
        </div>
        <button class="btn btn-primary" type="submit">إضافة مهمة +</button>
      </form>

      <div id="tasksList" style="display:grid;gap:10px"></div>
    </div>

    <!-- Habit + Pomodoro -->
    <div style="display:grid;gap:18px">
      <div class="card">
        <h3>🔥 متتبع العادات اليومية</h3>
        <form onsubmit="createHabit(event)" style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
          <input class="input" id="h_name" placeholder="عادة جديدة — مثال: قراءة 20 دقيقة" required style="flex:1;min-width:180px">
          <input class="input" id="h_icon" placeholder="🔥" value="🔥" style="width:70px">
          <input class="input" id="h_color" type="color" value="#8b5cf6" style="width:60px;padding:4px">
          <button class="btn btn-primary" type="submit">إضافة</button>
        </form>
        <div id="habitsList" style="display:grid;gap:10px"></div>
      </div>

      <div class="card" style="text-align:center">
        <h3>🍅 مؤقت التركيز — Pomodoro</h3>
        <div class="timer-ring" id="timerRing">
          <div class="timer-inner">
            <div>
              <div class="timer-time" id="timerTime">25:00</div>
              <div class="timer-label" id="timerLabel">جاهز للتركيز</div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="pomStart()">ابدأ</button>
          <button class="btn" onclick="pomPause()">إيقاف مؤقت</button>
          <button class="btn btn-ghost" onclick="pomReset()">إعادة</button>
          <select id="pomMode" onchange="pomSwitch(this.value)" class="select-sm">
            <option value="25">تركيز 25د</option>
            <option value="50">تركيز 50د</option>
            <option value="5">استراحة 5د</option>
            <option value="15">استراحة 15د</option>
          </select>
        </div>
        <div class="hint" style="margin-top:10px">يعمل محلياً بدون إرسال بيانات — صوت تنبيه عند الانتهاء</div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/pomodoro.js"></script>
</body>
</html>
