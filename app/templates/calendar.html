{% extends "base.html" %}
{% block title %}Nemvai — التقويم{% endblock %}
{% block head %}
<style>
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-cell{min-height:110px;border:1px solid var(--border);border-radius:12px;background:#0f0f17;padding:8px;position:relative}
.cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 2px rgba(124,58,237,.25)}
.cal-cell .day{font-weight:900;font-size:.9rem}
.cal-cell .muted{font-size:.7rem}
.cal-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}
.cal-task{font-size:.75rem;padding:4px 6px;border-radius:8px;background:#16161f;border:1px solid var(--border);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-task.high{border-color:rgba(239,68,68,.4)}
.cal-legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
</style>
{% endblock %}
{% block content %}
<div class="cal-head">
  <h2 style="margin:0">🗓️ التقويم — عرض مستقل</h2>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn btn-ghost" onclick="shiftMonth(-1)">‹</button>
    <div id="calTitle" style="font-weight:900;min-width:140px;text-align:center"></div>
    <button class="btn btn-ghost" onclick="shiftMonth(1)">›</button>
    <button class="btn btn-primary" onclick="goToday()">اليوم</button>
  </div>
</div>
<div class="cal-legend muted">
  <span><i class="cal-dot" style="background:var(--primary)"></i> اليوم</span>
  <span><i class="cal-dot" style="background:#ef4444"></i> عاجل/مرتفع</span>
  <span><i class="cal-dot" style="background:#06d6a0"></i> مكتمل</span>
</div>
<div id="calGrid" class="cal-grid"></div>
<div class="card" style="margin-top:14px">
  <h3 style="margin:0 0 8px 0">مهام <span id="calDayLabel">—</span></h3>
  <div id="calDayTasks" class="muted">اختر يوماً لعرض مهامه</div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/calendar.js"></script>
{% endblock %}
