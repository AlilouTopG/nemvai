<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Nemvai{% endblock %}</title>
<link rel="stylesheet" href="/static/css/main.css">
{% block head %}{% endblock %}
<meta name="color-scheme" content="dark">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">NV</div>
      <div><span>Nemvai</span><small id="userLine">... جاري التحقق</small></div>
    </div>
    <div class="nav-actions" style="gap:6px;flex-wrap:wrap">
      <a class="btn {% if request.path.startswith('/todos') or request.path=='/' %}btn-primary{% else %}btn-ghost{% endif %}" href="/todos">📋 المهام</a>
      <a class="btn {% if request.path.startswith('/calendar') %}btn-primary{% else %}btn-ghost{% endif %}" href="/calendar">🗓️ التقويم</a>
      <a class="btn {% if request.path.startswith('/habits') %}btn-primary{% else %}btn-ghost{% endif %}" href="/habits">🔥 العادات</a>
      <button class="btn btn-ghost" onclick="refreshAll&&refreshAll()">تحديث</button>
      <button class="btn btn-danger" onclick="logout()">خروج</button>
    </div>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
<div id="toast"></div>
<script>
// Shared secure helpers (XSS-safe: textContent only)
function toast(msg, ok=true){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.borderColor= ok ? "rgba(6,214,160,.4)" : "rgba(239,68,68,.4)";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2600);
}
function authHeaders(){
  const h={};
  const tok=localStorage.getItem("ax_token");
  if(tok) h["Authorization"]="Bearer "+tok;
  const m=document.cookie.match(/csrf_access_token=([^;]+)/);
  if(m) h["X-CSRF-TOKEN"]=decodeURIComponent(m[1]);
  return h;
}
async function api(path, opts={}){
  opts.credentials="include";
  opts.headers={...(opts.headers||{}), ...authHeaders()};
  if(opts.body && typeof opts.body==="string") opts.headers["Content-Type"]="application/json";
  const res= await fetch(path, opts);
  let data=null; try{ data= await res.json(); }catch{}
  if(res.status===401){ toast("انتهت الجلسة — سجل الدخول مجدداً",false); setTimeout(()=> location.href="/auth",1200); throw new Error("unauth"); }
  if(!res.ok) throw new Error((data&&(data.error||data.msg))||`خطأ ${res.status}`);
  return data;
}
async function loadMe(){
  try{
    const me= await api("/api/auth/me");
    if(!me.authenticated) throw new Error();
    document.getElementById("userLine").textContent = `${me.user.username} • ${me.user.email}`;
  }catch{ location.href="/auth"; }
}
async function logout(){
  try{ await api("/api/auth/logout",{method:"POST", body:"{}"}); }catch{}
  localStorage.removeItem("ax_token");
  location.href="/auth";
}
loadMe();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
